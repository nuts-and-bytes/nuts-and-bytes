<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="880" height="248" role="img" aria-label="stone · 为 AI 世界，留一点人味">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#EA580C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .serif { font-family: Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes floatStar {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      .glow { animation: pulseGlow 4.5s ease-in-out infinite; }
      .star-float { animation: floatStar 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Warm paper card -->
  <rect x="1" y="1" width="878" height="246" rx="16" fill="#FAF7F2" stroke="#E5DFD3" stroke-width="1.2"/>

  <!-- Subtle architectural top-right coordinates -->
  <text x="840" y="34" text-anchor="end" class="mono" font-size="10.5" letter-spacing="1.4" fill="#9C9489">39.9°N · BEIJING · HEYSTONE.SITE</text>

  <!-- Stone mark + wordmark -->
  <g transform="translate(42, 34)">
    <g transform="scale(0.30)" fill="#1C1917">
      <path d="M17 76C9 68 12 54 21 40C31 24 44 12 58 12C72 12 85 23 89 35C91 41 89 44 83 47L23 74Z"/>
      <path d="M23 76L87 53C91 51 93 54 94 60C100 85 83 94 56 94C35 94 23 88 17 80Z"/>
    </g>
    <text x="40" y="25" class="serif" font-size="25" letter-spacing="-0.8" fill="#1C1917">stone</text>
    <circle cx="102" cy="21" r="3" fill="#C2410C"/>
    <text x="116" y="24" class="mono" font-size="11" letter-spacing="0.8" fill="#78716C">/ nuts-and-bytes</text>
  </g>

  <!-- Main Chinese Headline -->
  <text x="42" y="128" class="serif" font-size="34" font-weight="600" letter-spacing="0.5" fill="#1C1917">为 AI 世界，留一点人味<tspan fill="#C2410C">。</tspan></text>

  <!-- English Epigraph -->
  <text x="43" y="160" class="serif" font-size="15.5" font-style="italic" fill="#57534E">Machines write the code. Someone still has to care why.</text>

  <!-- Subtle rule -->
  <line x1="42" y1="186" x2="500" y2="186" stroke="#E5DFD3" stroke-width="1"/>

  <!-- Bottom micro-meta -->
  <text x="42" y="213" class="mono" font-size="11" letter-spacing="2.2" fill="#78716C">EXPLORE · LEARN · BUILD · SHIP</text>

  <!-- Right-side orange-line-illustration: quiet open desk vignette -->
  <g transform="translate(555, 42)">
    <!-- Soft warm lamp glow -->
    <circle class="glow" cx="152" cy="86" r="78" fill="url(#lampGlow)"/>

    <!-- Floating constellation (Word Universe nod) -->
    <g class="star-float" stroke="#1C1917" stroke-width="1" stroke-opacity="0.35" fill="none">
      <line x1="44" y1="36" x2="78" y2="24"/>
      <line x1="78" y1="24" x2="104" y2="42"/>
      <line x1="44" y1="36" x2="68" y2="56"/>
      <circle cx="44" cy="36" r="2.2" fill="#1C1917" stroke="none"/>
      <circle cx="78" cy="24" r="3" fill="#C2410C" stroke="none"/>
      <circle cx="104" cy="42" r="2" fill="#1C1917" stroke="none"/>
      <circle cx="68" cy="56" r="1.8" fill="#78716C" stroke="none"/>
    </g>

    <!-- Desk surface hairline -->
    <line x1="12" y1="166" x2="286" y2="166" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="173" x2="256" y2="173" stroke="#D6CFC2" stroke-width="1" stroke-linecap="round"/>

    <!-- Tiny potted growing tree (Daily Tree nod) -->
    <g transform="translate(34, 108)">
      <path d="M12 58 L16 40 L36 40 L40 58 Z" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="14" y1="45" x2="38" y2="45" stroke="#1C1917" stroke-width="1" stroke-opacity="0.5"/>
      <path d="M26 40 C26 28 25 20 27 10" stroke="#1C1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M26 27 C19 23 14 19 10 14" stroke="#1C1917" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M26 22 C33 18 39 14 43 9" stroke="#1C1917" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M10 14 C4 12 4 5 11 5 C15 6 15 12 10 14 Z" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2"/>
      <path d="M27 10 C23 2 28 -3 34 1 C37 5 33 10 27 10 Z" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2"/>
      <path d="M43 9 C45 1 54 0 56 6 C54 12 47 13 43 9 Z" fill="#C2410C" fill-opacity="0.88" stroke="#1C1917" stroke-width="1.1"/>
    </g>

    <!-- Open book + pebble paperweight -->
    <g transform="translate(106, 134)">
      <path d="M4 32 Q34 24 62 31 Q90 24 120 32 L116 14 Q88 7 62 15 Q36 7 8 14 Z" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="62" y1="15" x2="62" y2="31" stroke="#1C1917" stroke-width="1.2"/>
      <line x1="18" y1="19" x2="48" y2="18" stroke="#A8A29E" stroke-width="1" stroke-linecap="round"/>
      <line x1="18" y1="24" x2="44" y2="23" stroke="#A8A29E" stroke-width="1" stroke-linecap="round"/>
      <line x1="74" y1="18" x2="104" y2="19" stroke="#A8A29E" stroke-width="1" stroke-linecap="round"/>
      <!-- Little stone pebble resting on book -->
      <ellipse cx="94" cy="24" rx="9" ry="5.5" fill="#1C1917"/>
      <path d="M89 22 Q94 20 98 22" stroke="#FAF7F2" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Warm desk lamp (signature Footer desk lamp nod) -->
    <g transform="translate(182, 46)">
      <!-- Base -->
      <path d="M42 120 L78 120 C76 113 44 113 42 120 Z" fill="#1C1917"/>
      <!-- Arm -->
      <path d="M60 114 L72 62 L32 34" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="72" cy="62" r="2.8" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.4"/>
      <!-- Lamp shade -->
      <path d="M12 42 L34 26 L44 38 L22 54 Z" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Warm terracotta bulb + light cone -->
      <circle cx="24" cy="48" r="3.6" fill="#C2410C"/>
      <path d="M13 48 L-16 98 L40 98 L27 54 Z" fill="#C2410C" fill-opacity="0.08"/>
    </g>
  </g>
</svg>

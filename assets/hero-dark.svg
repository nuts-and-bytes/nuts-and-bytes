<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="880" height="248" role="img" aria-label="stone · 为 AI 世界，留一点人味">
  <defs>
    <radialGradient id="lampGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#EA580C" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#171513" stop-opacity="0"/>
    </radialGradient>
    <style>
      .serif { font-family: Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      @keyframes floatStar {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      .glow { animation: pulseGlow 4.5s ease-in-out infinite; }
      .star-float { animation: floatStar 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Warm charcoal card -->
  <rect x="1" y="1" width="878" height="246" rx="16" fill="#171513" stroke="#2D2925" stroke-width="1.2"/>

  <!-- Subtle top-right coordinates -->
  <text x="840" y="34" text-anchor="end" class="mono" font-size="10.5" letter-spacing="1.4" fill="#78716C">39.9°N · BEIJING · HEYSTONE.SITE</text>

  <!-- Stone mark + wordmark -->
  <g transform="translate(42, 34)">
    <g transform="scale(0.30)" fill="#F5F0E6">
      <path d="M17 76C9 68 12 54 21 40C31 24 44 12 58 12C72 12 85 23 89 35C91 41 89 44 83 47L23 74Z"/>
      <path d="M23 76L87 53C91 51 93 54 94 60C100 85 83 94 56 94C35 94 23 88 17 80Z"/>
    </g>
    <text x="40" y="25" class="serif" font-size="25" letter-spacing="-0.8" fill="#F5F0E6">stone</text>
    <circle cx="102" cy="21" r="3" fill="#EA580C"/>
    <text x="116" y="24" class="mono" font-size="11" letter-spacing="0.8" fill="#A8A29E">/ nuts-and-bytes</text>
  </g>

  <!-- Main Chinese Headline -->
  <text x="42" y="128" class="serif" font-size="34" font-weight="600" letter-spacing="0.5" fill="#F5F0E6">为 AI 世界，留一点人味<tspan fill="#EA580C">。</tspan></text>

  <!-- English Epigraph -->
  <text x="43" y="160" class="serif" font-size="15.5" font-style="italic" fill="#A8A29E">Machines write the code. Someone still has to care why.</text>

  <!-- Subtle rule -->
  <line x1="42" y1="186" x2="500" y2="186" stroke="#2D2925" stroke-width="1"/>

  <!-- Bottom micro-meta -->
  <text x="42" y="213" class="mono" font-size="11" letter-spacing="2.2" fill="#A8A29E">EXPLORE · LEARN · BUILD · SHIP</text>

  <!-- Right-side orange-line-illustration: quiet open desk vignette -->
  <g transform="translate(555, 42)">
    <!-- Soft warm lamp glow -->
    <circle class="glow" cx="152" cy="86" r="82" fill="url(#lampGlowDark)"/>

    <!-- Floating constellation -->
    <g class="star-float" stroke="#E7E2D8" stroke-width="1" stroke-opacity="0.3" fill="none">
      <line x1="44" y1="36" x2="78" y2="24"/>
      <line x1="78" y1="24" x2="104" y2="42"/>
      <line x1="44" y1="36" x2="68" y2="56"/>
      <circle cx="44" cy="36" r="2.2" fill="#E7E2D8" stroke="none"/>
      <circle cx="78" cy="24" r="3" fill="#F97316" stroke="none"/>
      <circle cx="104" cy="42" r="2" fill="#E7E2D8" stroke="none"/>
      <circle cx="68" cy="56" r="1.8" fill="#A8A29E" stroke="none"/>
    </g>

    <!-- Desk surface hairline -->
    <line x1="12" y1="166" x2="286" y2="166" stroke="#E7E2D8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="173" x2="256" y2="173" stroke="#3B3530" stroke-width="1" stroke-linecap="round"/>

    <!-- Tiny potted growing tree -->
    <g transform="translate(34, 108)">
      <path d="M12 58 L16 40 L36 40 L40 58 Z" fill="#171513" stroke="#E7E2D8" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="14" y1="45" x2="38" y2="45" stroke="#E7E2D8" stroke-width="1" stroke-opacity="0.45"/>
      <path d="M26 40 C26 28 25 20 27 10" stroke="#E7E2D8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M26 27 C19 23 14 19 10 14" stroke="#E7E2D8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M26 22 C33 18 39 14 43 9" stroke="#E7E2D8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M10 14 C4 12 4 5 11 5 C15 6 15 12 10 14 Z" fill="#171513" stroke="#E7E2D8" stroke-width="1.2"/>
      <path d="M27 10 C23 2 28 -3 34 1 C37 5 33 10 27 10 Z" fill="#171513" stroke="#E7E2D8" stroke-width="1.2"/>
      <path d="M43 9 C45 1 54 0 56 6 C54 12 47 13 43 9 Z" fill="#EA580C" fill-opacity="0.92" stroke="#F5F0E6" stroke-width="1"/>
    </g>

    <!-- Open book + pebble paperweight -->
    <g transform="translate(106, 134)">
      <path d="M4 32 Q34 24 62 31 Q90 24 120 32 L116 14 Q88 7 62 15 Q36 7 8 14 Z" fill="#171513" stroke="#E7E2D8" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="62" y1="15" x2="62" y2="31" stroke="#E7E2D8" stroke-width="1.2"/>
      <line x1="18" y1="19" x2="48" y2="18" stroke="#78716C" stroke-width="1" stroke-linecap="round"/>
      <line x1="18" y1="24" x2="44" y2="23" stroke="#78716C" stroke-width="1" stroke-linecap="round"/>
      <line x1="74" y1="18" x2="104" y2="19" stroke="#78716C" stroke-width="1" stroke-linecap="round"/>
      <ellipse cx="94" cy="24" rx="9" ry="5.5" fill="#E7E2D8"/>
      <path d="M89 22 Q94 20 98 22" stroke="#171513" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>

    <!-- Warm desk lamp -->
    <g transform="translate(182, 46)">
      <path d="M42 120 L78 120 C76 113 44 113 42 120 Z" fill="#E7E2D8"/>
      <path d="M60 114 L72 62 L32 34" stroke="#E7E2D8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="72" cy="62" r="2.8" fill="#171513" stroke="#E7E2D8" stroke-width="1.4"/>
      <path d="M12 42 L34 26 L44 38 L22 54 Z" fill="#171513" stroke="#E7E2D8" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="24" cy="48" r="3.8" fill="#F97316"/>
      <path d="M13 48 L-16 98 L40 98 L27 54 Z" fill="#F97316" fill-opacity="0.14"/>
    </g>
  </g>
</svg>

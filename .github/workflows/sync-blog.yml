name: Sync Latest Blog Posts

on:
  schedule:
    - cron: "30 0 * * *" # Daily 08:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Sync latest posts from blog.heystone.site RSS
        run: python3 scripts/sync_blog.py

      - name: Commit and push if updated
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync latest posts from blog.heystone.site"
            git push
          fi
